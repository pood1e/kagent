version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  ignore:
    - a2a.proto
    - ateapi.proto
    - ateenv/v1alpha/guest.proto
breaking:
  use:
    - FILE
    - PACKAGE_MESSAGE_NO_DELETE
  # Actor JWT migration removes caller-owned memory identity fields. Remove
  # this exception once the removal is present on the comparison branch.
  ignore_only:
    # TaskReference retains its package and wire identity in common.proto.
    MESSAGE_NO_DELETE:
      - kagent/api/v1/execution.proto
    FIELD_NO_DELETE:
      - kagent/runtime/v1/memory.proto
  # Vendored upstream alpha API; upgrades follow go.mod. Kagent does not expose
  # its egress policy types, which changed incompatibly in alpha3.
  ignore:
    - ateapi.proto
  ignore_unstable_packages: true
