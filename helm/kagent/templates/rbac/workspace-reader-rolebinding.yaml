{{- if (include "kagent.rbacNamespaces" . | fromJsonArray) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kagent.fullname" . }}-workspace-reader
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kagent.fullname" . }}-workspace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kagent.controller.serviceAccountName" . | quote }}
    namespace: {{ include "kagent.namespace" . }}
{{- end }}
