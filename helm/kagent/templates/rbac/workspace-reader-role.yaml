{{- $namespaces := include "kagent.rbacNamespaces" . | fromJsonArray -}}
{{- if $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-workspace-reader
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames:
      {{- toYaml $namespaces | nindent 6 }}
    verbs: [get]
{{- end }}
