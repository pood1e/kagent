name: AgentOS images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentos-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  VERSION: 0.0.0-main.g${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: kagent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kagent-ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d kagent" --health-interval 2s --health-retries 15
    env:
      KAGENT_TEST_POSTGRES_URL: postgresql://postgres:kagent-ci@localhost:5432/kagent?sslmode=disable
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: psql "$KAGENT_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - run: echo "KUBEBUILDER_ASSETS=$(go tool setup-envtest use 1.37 -p path)" >> "$GITHUB_ENV"
      - name: Install the matching gateway test binary
        env:
          AGENTGATEWAY_VERSION: v1.7.0
          AGENTGATEWAY_SHA256: 1b2fc01a2de29ca113bbb6258b5cae7b1eb3c724071c09d687a449132f2f42f8
        run: |
          binary="$RUNNER_TEMP/agentgateway"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/agentgateway/agentgateway/releases/download/${AGENTGATEWAY_VERSION}/agentgateway-linux-amd64" \
            --output "$binary"
          printf '%s  %s\n' "$AGENTGATEWAY_SHA256" "$binary" | sha256sum --check --strict
          chmod 0755 "$binary"
          echo "KAGENT_TEST_AGENTGATEWAY=$binary" >> "$GITHUB_ENV"
      - name: Test the AgentOS runtime extensions
        run: |
          go test -race -count=1 ./api/a2a ./core/internal/database ./core/pkg/migrations \
            ./core/internal/runtimeauth ./core/internal/executionauth ./core/internal/service/execution ./core/internal/service/admission ./core/internal/service/kubecrud ./core/internal/service/memory ./core/internal/service/taskstore \
            ./core/internal/service/session ./core/internal/service/tool ./core/internal/service/scheduledrun \
            ./core/internal/controller/scheduledrun ./core/internal/grpcserver ./core/internal/a2agateway \
            ./core/internal/mcp ./core/internal/translator/adkconfig ./core/internal/substrate \
            ./core/internal/translator ./core/internal/utils \
            ./core/internal/service/inventory ./core/internal/service/system \
            ./core/pkg/config ./core/pkg/env ./core/pkg/app ./pkg/telemetry/... ./pkg/tracing
          go test -race -count=1 ./core/internal/translator/claude ./core/internal/translator/codex \
            ./harness/... ./adk/pkg/a2a/... ./adk/pkg/config ./adk/pkg/declarative ./adk/pkg/tools ./adk/pkg/controllerclient ./adk/pkg/taskstore \
            ./adk/pkg/embedding ./adk/pkg/nativeagent ./adk/pkg/agent ./adk/pkg/runner
          go test -race -count=1 ./core/internal/controller ./core/internal/httpserver/auth ./core/pkg/auth
      - run: make lint AWK=awk
      - name: Test and lint the optional agentgateway integration
        working-directory: go/integrations/agentgateway
        run: |
          go test -race -count=1 ./...
          ../../bin/golangci-lint-custom run --config ../../.golangci.yaml
      - name: Build binaries
        run: |
          out=../dist
          mkdir -p "$out/controller" "$out/claude-harness" "$out/standard-harness/rootfs" \
            "$out/codex-harness/rootfs/usr/local/bin"
          for harness in claude-harness standard-harness codex-harness; do
            cp ../agentos/images/toolbox.sh "$out/$harness/toolbox.sh"
          done
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/kagent-dev/kagent/go/core/internal/version.Version=$VERSION -X github.com/kagent-dev/kagent/go/core/internal/version.GitCommit=$GITHUB_SHA -X github.com/kagent-dev/kagent/go/core/internal/version.SubstrateVersion=0.6.0-alpha3" \
            -o "$out/controller/kagent-controller" ./core/cmd/controller
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w' \
            -o "$out/claude-harness/kagent-claude" ./harness/claude/cmd
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w' \
            -o "$out/standard-harness/rootfs/app" ./adk/cmd
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w' \
            -o "$out/codex-harness/rootfs/usr/local/bin/kagent-codex" ./harness/codex/cmd
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: contexts
          path: dist/
          if-no-files-found: error
          retention-days: 1

  images:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: controller
            dockerfile: controller
            entrypoint: /app
          - component: claude-harness
            dockerfile: claude-harness
            entrypoint: /usr/local/bin/kagent-claude
          - component: standard-harness
            dockerfile: harness
            entrypoint: /app
            # Upstream main snapshot 692964d30c6b; the runtime binary comes from this checkout.
            base: ghcr.io/kagent-dev/kagent/golang-adk@sha256:a9193f48437a3f1e12149bd754fd488b7d3b57be818974f19e904fa4d7363284
          - component: codex-harness
            dockerfile: harness
            entrypoint: /usr/local/bin/kagent-codex
            base: ghcr.io/kagent-dev/kagent/codex-harness@sha256:2c9b447cd2d6a78b56b91b9ec78658388ab2df27290062fcbd070c6cde0a5315
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: contexts
          path: dist/
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: dist/${{ matrix.component }}
          file: agentos/images/${{ matrix.dockerfile }}/Dockerfile
          build-args: ${{ matrix.base && format('HARNESS_IMAGE={0}', matrix.base) || '' }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.component }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.component }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.ref.name=main
      - name: Verify the published entrypoint
        run: docker run --rm --entrypoint '${{ matrix.entrypoint }}' "${REGISTRY}/${{ matrix.component }}@${{ steps.build.outputs.digest }}" --help
      - run: echo "${REGISTRY}/${{ matrix.component }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Export image metadata
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p metadata
          name="$COMPONENT"
          if [ "$name" = standard-harness ]; then name=golang-adk; fi
          jq -n --arg digest "$DIGEST" '{"containerimage.digest": $digest}' > "metadata/$name.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: metadata-${{ matrix.component }}
          path: metadata/
          if-no-files-found: error
          retention-days: 1

  charts:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: metadata-*
          merge-multiple: true
          path: metadata/
      - name: Install Helm
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            -o /tmp/helm.tgz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo '0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm.tgz' | sha256sum --check
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python3 -m venv /tmp/chart-venv
          /tmp/chart-venv/bin/pip install PyYAML==6.0.3
      - name: Package fork charts
        run: |
          cp -R helm /tmp/release-helm
          mkdir -p /tmp/release-helm/kagent/files
          bash scripts/harness-image-catalog.sh "$VERSION" metadata \
            "$REGISTRY/standard-harness" "$REGISTRY/claude-harness" "$REGISTRY/codex-harness" \
            > /tmp/release-helm/kagent/files/builtin-harness-images.json
          /tmp/chart-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          root = Path('/tmp/release-helm')
          values = root / 'kagent/values.yaml'
          config = yaml.safe_load(values.read_text())
          digest = json.loads(Path('metadata/controller.json').read_text())['containerimage.digest']
          config['controller']['image'].update(registry='ghcr.io', repository=os.environ['GITHUB_REPOSITORY'] + '/controller', tag=os.environ['GITHUB_SHA'] + '@' + digest)
          config['ui']['replicas'] = 0
          config['ui']['image']['tag'] = '0.0.0-alpha.g692964d30c6b@sha256:c212265004302450b7a0f10442e125e528fddc16aaaf3cbfd1cb760afab19e6b'
          for name in ('kagent-tools', 'grafana-mcp'):
              config[name]['enabled'] = False
          values.write_text(yaml.safe_dump(config, sort_keys=False))
          for name in ('kagent', 'kagent-crds'):
              template = root / name / 'Chart-template.yaml'
              template.write_text(template.read_text().replace('https://github.com/kagent-dev/kagent', 'https://github.com/' + os.environ['GITHUB_REPOSITORY']))
          PY
          make helm-version VERSION="$VERSION" HELM_SOURCE_DIR=/tmp/release-helm HELM_DIST_FOLDER=/tmp/release-charts
          helm lint /tmp/release-charts/kagent-"$VERSION".tgz /tmp/release-charts/kagent-crds-"$VERSION".tgz
      - name: Publish charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/release-charts
          sha256sum kagent-"$VERSION".tgz kagent-crds-"$VERSION".tgz > SHA256SUMS
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for chart in kagent kagent-crds; do
            helm push "$chart-$VERSION.tgz" "oci://$REGISTRY/helm"
          done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --prerelease \
            --notes "Digest-pinned fork runtime charts for revision $GITHUB_SHA." \
            kagent-"$VERSION".tgz kagent-crds-"$VERSION".tgz SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
